# Pick the pinentry backend ourselves; see the wrapper for the reasoning.
#
# Arch's /usr/bin/pinentry is a shell wrapper that guesses from $DISPLAY /
# $XDG_SESSION_TYPE, but evaluates them in *gpg-agent's* environment, which
# under a Hyprland session has neither -- so it falls back to pinentry-curses
# and hangs with no visible prompt. Hardcoding pinentry-gnome3 instead breaks
# the opposite case: over SSH the dialog opens on the physical screen, where
# the person who needs to type it can't see it.
#
# The path must be absolute (gpg-agent expands neither ~ nor $HOME) and this
# file is shared across machines with different usernames and home prefixes --
# so it points at a fixed system location, symlinked per machine to the copy
# in this repo. See README, step 2.
pinentry-program /usr/local/bin/pinentry-auto

# Keep the key cached long enough that Bridge restarts don't re-prompt.
default-cache-ttl 3600
max-cache-ttl 28800

# Don't give up on an unanswered prompt after ~60s. Bridge treats a keychain
# timeout as a hard vault failure and only tolerates three of those before it
# RESETS the vault and logs the account out -- so walking away from the prompt
# must not cost an attempt. 0 = wait indefinitely.
pinentry-timeout 0
